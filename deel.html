<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pip Wrapped delen</title>
  <link rel="icon" href="pip.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;600;700;800&display=swap">
  <!-- De deelkaart van Pip Wrapped. De Hub zet de cijfers in het adres (#d=…)
       en laat een QR-code zien; hier wordt er een foto van gemaakt die je met het
       deelmenu van je telefoon verstuurt. Er gaat geen code of account mee. -->
  <style>
    :root { --bg: #fbf7f2; --text: #1a1612; --muted: #6b5f54; --accent: #a9642f; --line: #eee7de; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; padding: 20px 16px 28px; background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .card { width: min(100%, 380px); aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; background: #24170f; box-shadow: 0 10px 30px rgb(26 22 18 / 0.18); }
    .card img { display: block; width: 100%; height: 100%; }
    .buttons { width: min(100%, 380px); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { min-height: 52px; border-radius: 16px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
    .share { border: 0; background: var(--accent); color: #fff; }
    .save { border: 1px solid #e3d8cb; background: #fff; color: var(--text); }
    .note { max-width: 380px; color: var(--muted); font-size: 14px; line-height: 1.45; text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Pip Wrapped</h1>
  <div class="card" id="card" hidden><img id="preview" alt="Deelkaart van Pip Wrapped"></div>
  <div class="buttons" id="buttons" hidden>
    <button class="share" id="share" type="button">Delen</button>
    <button class="save" id="save" type="button">Bewaar in Foto's</button>
  </div>
  <p class="note" id="note">Deelkaart maken…</p>

  <script>
  (function () {
    "use strict";
    const W = 1080;
    const H = 1920;
    const els = {
      card: document.getElementById("card"),
      preview: document.getElementById("preview"),
      buttons: document.getElementById("buttons"),
      share: document.getElementById("share"),
      save: document.getElementById("save"),
      note: document.getElementById("note"),
    };

    // #d= is JSON in base64url: { y: jaar, s: [[label, waarde, onderschrift], …] }.
    function readData() {
      const match = location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
      if (!match) return null;
      try {
        const base64 = match[1].replace(/-/g, "+").replace(/_/g, "/");
        const json = decodeURIComponent(escape(atob(base64)));
        const data = JSON.parse(json);
        return data && Array.isArray(data.s) ? data : null;
      } catch (error) {
        return null;
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    // Vullen zoals object-fit: cover, met het midden op (fx, fy) en eventueel ingezoomd.
    function drawCover(ctx, image, x, y, w, h, fx, fy, zoom = 1) {
      const scale = Math.max(w / image.width, h / image.height) * zoom;
      const sw = w / scale;
      const sh = h / scale;
      const sx = (image.width - sw) * fx;
      const sy = (image.height - sh) * fy;
      ctx.drawImage(image, sx, sy, sw, sh, x, y, w, h);
    }

    function text(ctx, value, x, y, font, color, align = "left", spacing = 0) {
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      if ("letterSpacing" in ctx) ctx.letterSpacing = `${spacing}px`;
      ctx.fillText(value, x, y);
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    }

    // Kleiner maken tot het in de breedte past.
    function fitFont(ctx, value, weight, size, family, maxWidth) {
      let current = size;
      ctx.font = `${weight} ${current}px ${family}`;
      while (ctx.measureText(value).width > maxWidth && current > 20) {
        current -= 4;
        ctx.font = `${weight} ${current}px ${family}`;
      }
      return `${weight} ${current}px ${family}`;
    }

    async function draw(data) {
      await Promise.all([
        document.fonts.load('800 230px "Outfit"'),
        document.fonts.load('700 40px "Outfit"'),
        document.fonts.load('600 40px "Outfit"'),
        document.fonts.load('italic 400 80px "Instrument Serif"'),
      ]).catch(() => {});
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#24170f";
      ctx.fillRect(0, 0, W, H);

      try {
        const photo = await loadImage("pip-foto.jpg");
        // Ingezoomd op Pip: minder deken erboven.
        drawCover(ctx, photo, 0, 0, W, 860, 0.8, 1, 1.42);
      } catch (error) {
        // Geen foto: dan alleen de donkere achtergrond.
      }
      const fade = ctx.createLinearGradient(0, 600, 0, 860);
      fade.addColorStop(0, "rgba(36,23,15,0)");
      fade.addColorStop(1, "rgba(36,23,15,1)");
      ctx.fillStyle = fade;
      ctx.fillRect(0, 600, W, 260);

      const cells = data.s.map(([label, value, sub]) => ({ label, value, sub }));
      const take = (label) => {
        const index = cells.findIndex((cell) => cell.label === label);
        return index >= 0 ? cells.splice(index, 1)[0] : null;
      };
      // Wc-ritme: het type staat in de uitleg. "Kattentype" is de oude naam
      // (links gedeeld voor november 2026), daar stond het type in de waarde.
      const wc = take("Wc-ritme");
      const old = wc ? null : take("Kattentype");
      const typeName = wc ? wc.sub : old ? `De ${old.value}` : null;
      const baasje = take("Favoriete baasje");

      text(ctx, "PIP WRAPPED", 90, 930, '700 40px "Outfit"', "#f3c77a", "left", 8);
      text(ctx, String(data.y), 80, 1120, '800 210px "Outfit"', "#fbf7f2", "left", -10);
      if (typeName) text(ctx, typeName, 90, 1210, 'italic 400 80px "Instrument Serif"', "#f3c77a");

      // Per vak: het onderwerp klein erboven, het getal groot, de uitleg eronder.
      cells.slice(0, 4).forEach((cell, i) => {
        const x = i % 2 === 0 ? 90 : 570;
        const y = 1320 + Math.floor(i / 2) * 200;
        text(ctx, cell.label.toUpperCase(), x, y, fitFont(ctx, cell.label.toUpperCase(), 700, 28, '"Outfit"', 420), "#f3c77a", "left", 4);
        text(ctx, cell.value, x, y + 82, fitFont(ctx, cell.value, 800, 88, '"Outfit"', 420), "#fbf7f2", "left", -2);
        if (cell.sub) text(ctx, cell.sub, x, y + 126, fitFont(ctx, cell.sub, 600, 32, '"Outfit"', 420), "rgba(251,247,242,0.72)");
      });

      if (baasje) {
        ctx.fillStyle = "#f3c77a";
        ctx.beginPath();
        // Met ruimte eromheen: even ver van de cijfers als van de onderkant.
        if (ctx.roundRect) ctx.roundRect(90, 1730, 900, 116, 34);
        else ctx.rect(90, 1730, 900, 116);
        ctx.fill();
        text(ctx, "Pips favoriete baasje", 140, 1801, '600 38px "Outfit"', "#24170f");
        text(ctx, `${baasje.value} · ${baasje.sub.replace(" punten", " pt")}`, 940, 1804, '800 50px "Outfit"', "#24170f", "right");
      }
      return canvas;
    }

    function toBlob(canvas) {
      return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    }

    async function start() {
      const data = readData();
      if (!data) {
        els.note.textContent = "Open deze pagina met de QR-code bij Pip Wrapped op de Google Hub.";
        return;
      }
      const canvas = await draw(data);
      const blob = await toBlob(canvas);
      const file = new File([blob], `pip-wrapped-${data.y}.png`, { type: "image/png" });
      const url = URL.createObjectURL(blob);
      // Een data-adres: dan werkt ingedrukt houden → "Voeg toe aan Foto's" ook.
      els.preview.src = canvas.toDataURL("image/png");
      els.card.hidden = false;
      els.buttons.hidden = false;
      els.note.textContent = "Delen opent WhatsApp, Berichten of mail met deze kaart als foto.";

      // Een iPhone of iPad zet een download in Bestanden, niet in Foto's. Via het
      // deelmenu kan het wel: daar staat "Bewaar afbeelding" bovenaan.
      const apple = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const canShareFile = Boolean(navigator.canShare && navigator.canShare({ files: [file] }));

      function download() {
        const link = document.createElement("a");
        link.href = url;
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      async function save() {
        if (apple && canShareFile) {
          els.note.textContent = 'Tik op "Bewaar afbeelding": dan staat hij in je fotoalbum.';
          try {
            await navigator.share({ files: [file] });
          } catch (error) {
            // Geannuleerd: niets aan de hand.
          }
          return;
        }
        download();
        els.note.textContent = "De foto staat bij je downloads en in je fotoalbum onder Downloads.";
      }

      els.save.addEventListener("click", save);
      els.share.addEventListener("click", async () => {
        if (canShareFile) {
          try {
            await navigator.share({ files: [file], title: `Pip Wrapped ${data.y}` });
          } catch (error) {
            // Delen geannuleerd: niets aan de hand.
          }
        } else {
          download();
          els.note.textContent = "Delen kan hier niet; de foto is bewaard.";
        }
      });
    }

    start();
  })();
  </script>
</body>
</html>
