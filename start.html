<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Pip</title>
  <link rel="icon" href="pip.png">
  <link rel="apple-touch-icon" href="pip.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
  <style>
    :root {
      --bg: #f6f1ea;
      --line: #eadfd3;
      --text: #2b2420;
      --muted: #8a7f76;
      --accent: #e07a3a;
      --done: #2f8a5b;
      --warn: #a86f00;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14110e;
        --line: #3a322b;
        --text: #f3ece4;
        --muted: #a3978c;
        --accent: #f0975a;
        --done: #5cc28f;
        --warn: #f2b84b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Nunito", system-ui, -apple-system, sans-serif;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    img {
      width: 88px;
      height: 88px;
    }

    h1 {
      margin-top: 16px;
      font-size: 2rem;
      font-weight: 800;
    }

    #status {
      min-height: 3em;
      margin-top: 8px;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 700;
    }

    #status.ok {
      color: var(--done);
    }

    #status.error {
      color: var(--warn);
    }

    button {
      width: 100%;
      min-height: 64px;
      margin-top: 16px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    button.secondary {
      min-height: 52px;
      margin-top: 12px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 1.05rem;
    }

    .note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <img src="pip.png" alt="">
    <h1>Pip op de Hub</h1>
    <p id="status">Even laden…</p>
    <button id="start" disabled>Start Pip</button>
    <button id="stop" class="secondary" hidden>Stop Pip op de Hub</button>
    <p class="note">Werkt in Chrome op Android of op je Mac, op hetzelfde wifi als de Hub. Kies na het tikken je Nest Hub in de lijst.</p>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      "use strict";

      const appId = window.PIP_CONFIG.castAppId;
      const status = document.getElementById("status");
      const startButton = document.getElementById("start");
      const stopButton = document.getElementById("stop");
      let castLoaded = false;

      function show(text, kind) {
        status.textContent = text;
        status.className = kind || "";
      }

      // Het Cast-script roept deze functie aan zodra het geladen is.
      window.__onGCastApiAvailable = function (isAvailable) {
        castLoaded = true;
        if (!appId) return show("Vul eerst castAppId in config.js in.", "error");
        if (!isAvailable) return show("Deze browser kan niet casten. Gebruik Chrome op Android of je Mac.", "error");

        const context = cast.framework.CastContext.getInstance();
        context.setOptions({
          receiverApplicationId: appId,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
        });
        context.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, updateStatus);
        startButton.addEventListener("click", start);
        stopButton.addEventListener("click", () => context.endCurrentSession(true));
        startButton.disabled = false;
        updateStatus();
      };

      function updateStatus() {
        const session = cast.framework.CastContext.getInstance().getCurrentSession();
        stopButton.hidden = !session;
        if (session) show(`Pip staat aan op ${session.getCastDevice().friendlyName}.`, "ok");
        else show("Klaar om te starten.");
      }

      function start() {
        show("Kies je Nest Hub…");
        cast.framework.CastContext.getInstance().requestSession().then(updateStatus, (error) => {
          if (error === chrome.cast.ErrorCode.CANCEL) updateStatus();
          else show(`Starten lukte niet (${error}). Staat de Hub aan en zit je op hetzelfde wifi?`, "error");
        });
      }

      // Laadt het Cast-script niet (Safari, geen internet), dan melden we dat na een paar seconden.
      setTimeout(() => {
        if (!castLoaded) show("Casten is hier niet beschikbaar. Gebruik Chrome op Android of je Mac.", "error");
      }, 5000);
    })();
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
