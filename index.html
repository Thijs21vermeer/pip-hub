<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pip</title>
  <link rel="icon" href="pip.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" id="logo"></span>
      <div>
        <h1>Pip</h1>
        <p id="progress-text"></p>
      </div>
    </div>
    <div class="when">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
  </header>

  <div class="progress"><div id="progress-bar"></div></div>

  <main>
    <div class="left">
      <div class="group-head">
        <h2 class="group-title">Taken</h2>
        <button class="group-link" id="tasks-more" data-action="all-tasks"></button>
      </div>
      <section class="tasks" id="tasks" aria-label="Taken"></section>
      <h2 class="group-title">Acties</h2>
      <section class="actions" id="actions" aria-label="Acties"></section>
    </div>
    <aside class="stock">
      <h2>Voorraad</h2>
      <div id="stock"></div>
    </aside>
  </main>

  <!-- Alle taken: bekijken, afvinken en beheren (toevoegen, wijzigen, volgorde). -->
  <section class="page" id="page" hidden aria-label="Alle taken">
    <header class="page-head">
      <button class="page-back" data-action="page-close">‹ Terug</button>
      <div>
        <h2>Alle taken</h2>
        <p id="page-hint"></p>
      </div>
      <button class="page-edit" id="page-edit" data-action="page-edit"></button>
    </header>
    <div class="page-grid" id="page-grid"></div>
  </section>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="cast.js"></script>
</body>
</html>
